name: CI

on:
  push:
  pull_request:

jobs:
  test:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,runtime]"
      - run: npm ci
      - run: python -m pytest -q
      - run: node --test tests/console_interactions.test.mjs tests/panel_interactions.test.mjs tests/dialog_dismiss.test.mjs tests/ui_copy.test.mjs
      - run: python -m ruff check --select E9,F63,F7,F82 framework webapp slidepoise/scripts tests setup.py
      - run: python slidepoise/scripts/preflight_config.py framework/defaults/slidepoise-config.json
      - run: python slidepoise/scripts/preflight_catalogs.py --profiles-root profiles
      - run: python slidepoise/scripts/audit_skill_boundaries.py

  package:
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade build
      - run: npm ci
      - run: python -m build
      - run: npm pack --dry-run
      - run: python -m pip install dist/*.whl
      - run: slidepoise --version
      - run: slidepoise setup --skip-skill --skip-sam
      - run: slidepoise doctor
