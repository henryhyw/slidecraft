[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slidecraft-ai"
version = "0.1.0a1"
description = "Create polished, editable PowerPoint presentations through an AI Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Slidecraft contributors" }]
dependencies = [
  "jsonschema>=4.20",
  "Pillow>=10.0",
  "platformdirs>=4.2",
  "keyring>=25.6",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
cv = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pytesseract>=0.3.13",
]
openai = ["openai>=1.101", "CairoSVG>=2.7"]
agent = ["mcp>=2,<3"]
documents = ["pypdf>=5", "python-docx>=1.1", "openpyxl>=3.1"]
segmentation = [
  "torch>=2.5",
  "torchvision>=0.20",
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a2",
]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "openai>=1.101", "mcp>=2,<3"]
all = [
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pytesseract>=0.3.13",
  "openai>=1.101",
  "CairoSVG>=2.7",
  "mcp>=2,<3",
  "pypdf>=5",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "torch>=2.5",
  "torchvision>=0.20",
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a2",
]

[project.scripts]
slidecraft = "slidecraft.cli:main"
slidecraft-mcp = "slidecraft.mcp_server:main"
slidecraft-console = "slidecraft.console:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slidecraft = [
  "schemas/*.json",
  "defaults/*.toml",
  "defaults/*.json",
  "guidance_profiles/*.json",
  "ui/*.html",
  "ui/*.css",
  "ui/*.js",
  "starter_resources/visual_references/*",
  "starter_resources/icons/*",
  "starter_resources/components/*",
  "starter_resources/components/*/*",
]

[tool.setuptools.data-files]
"share/slidecraft/js" = ["js/scene_to_pptx.mjs"]
"share/slidecraft/scripts" = ["scripts/render_with_powerpoint_mac.py", "scripts/measure_visual_scene.py"]
"share/slidecraft/integrations/skills/slidecraft" = ["integrations/skills/slidecraft/SKILL.md"]
"share/slidecraft/integrations/skills/slidecraft/agents" = ["integrations/skills/slidecraft/agents/openai.yaml"]
"share/slidecraft/integrations/skills/slidecraft/references" = ["integrations/skills/slidecraft/references/planning.md"]


[tool.ruff]
line-length = 120
target-version = "py310"
cache-dir = "workspace/cache/ruff"
extend-exclude = ["tools/historical_regression"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
cache_dir = "workspace/cache/pytest"
