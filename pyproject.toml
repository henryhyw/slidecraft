[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slidepoise"
version = "0.5.0"
description = "Profile-driven presentation framework with an Agent skill, isolated libraries, reconstruction runtime, and optional console"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agent", "powerpoint", "presentations", "pptx"]
dependencies = ["Pillow>=10", "python-pptx>=1.0.2"]

[project.optional-dependencies]
runtime = ["numpy>=1.26", "opencv-python>=4.10"]
sam = [
  "torch>=2.5",
  "torchvision>=0.20",
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9"]

[project.scripts]
slidepoise = "framework.cli:main"
slidepoise-console = "webapp.server:main"

[tool.setuptools]
packages = ["framework", "webapp"]
include-package-data = false

[tool.setuptools.package-data]
webapp = ["ui/*.html", "ui/*.css", "ui/*.js", "console/*.html", "console/*.css", "console/*.js"]
framework = ["defaults/*.json", "templates/*.json", "node-runtime-package.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "workspace/pytest-cache"

[tool.ruff]
line-length = 120
target-version = "py310"
cache-dir = "workspace/ruff-cache"
